<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WeDigi Games">
  <defs>
    <mask id="play">
      <rect width="64" height="64" fill="#fff"/>
      <!-- pixel-stepped play triangle -->
      <g fill="#000">
        <rect x="24" y="16" width="8" height="32"/>
        <rect x="32" y="20" width="8" height="24"/>
        <rect x="40" y="26" width="8" height="12"/>
      </g>
    </mask>
  </defs>
  <rect width="64" height="64" rx="16" fill="#FF4D3D" mask="url(#play)"/>
</svg>
